[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-splitplane"
version = "0.5.0"
description = "Split a KiCad power layer into one continuous copper zone per net"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aleksandar Tuzlak" }]
requires-python = ">=3.9"
dependencies = ["shapely>=2.0", "numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]
keywords = ["kicad", "pcb", "power-plane", "split-plane", "voronoi", "eda", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.urls]
Homepage = "https://people.ee.ethz.ch/~atuzlak/kicad-splitplane"
Source = "https://github.com/atuzlak/kicad-splitplane"

[project.scripts]
kicad-splitplane = "kicad_splitplane:main"
kicad-splitplane-mcp = "kicad_splitplane_mcp:main"

[tool.setuptools]
py-modules = ["kicad_splitplane", "kicad_splitplane_mcp"]
