[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-splitplane"
version = "0.2.0"
description = "Split a KiCad power layer into one continuous copper zone per net"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Aleksandar Tuzlak" }]
requires-python = ">=3.9"
dependencies = ["shapely>=2.0", "numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]
keywords = ["kicad", "pcb", "power-plane", "split-plane", "voronoi", "eda"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://people.ee.ethz.ch/~atuzlak/kicad-splitplane/"
Source = "https://github.com/atuzlak/kicad-splitplane"

[project.scripts]
kicad-splitplane = "kicad_splitplane:main"

[tool.setuptools]
py-modules = ["kicad_splitplane"]
