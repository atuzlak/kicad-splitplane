# Daily: add the last 14 days of GitHub clone traffic to clones.json on the
# 'stats' branch, which the web page reads (GitHub itself forgets after 14 days).
#
# Needs a repository secret TRAFFIC_TOKEN: a fine-grained personal access
# token for this repository only, with "Administration: Read-only" (the
# traffic API is not available to the workflow's own token). The run stops
# with an error naming the secret if it is missing.
name: clone-stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: stats
          path: stats
      - name: Merge the last 14 days
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The TRAFFIC_TOKEN secret is missing or empty. Create a fine-grained token for this repository with 'Administration: Read-only' and save it as the repository secret TRAFFIC_TOKEN."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/traffic/clones" > clones-14d.json
          python3 .github/clone_stats.py stats/clones.json < clones-14d.json
      - name: Commit if the counts changed
        shell: bash
        working-directory: stats
        run: |
          set -euo pipefail
          # The "updated" time changes on every run; only commit when the
          # clone numbers themselves changed.
          if git diff --quiet -I '"updated":' -- clones.json; then
            echo "No new clones; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clones.json
          git commit -m "Clone statistics $(date -u +%F)"
          git push
